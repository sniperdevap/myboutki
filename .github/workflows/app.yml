name: myboutki app

# Google OAuth client IDs below are public identifiers (not secrets).
on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Prepare project
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash app/tool/prepare.sh
      - name: Check code
        run: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK and App Bundle
        run: |
          cd app
          flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || '757704906396-fc5cgu4cq6gih42f5g3andjp6tef3p11.apps.googleusercontent.com' }}
          flutter build appbundle --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || '757704906396-fc5cgu4cq6gih42f5g3andjp6tef3p11.apps.googleusercontent.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: myboutki-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Prepare project
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || '757704906396-lr2tf39v4eknna166gvnpm6qukbei0u7.apps.googleusercontent.com' }}
          GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ vars.GOOGLE_IOS_REVERSED_CLIENT_ID || 'com.googleusercontent.apps.757704906396-lr2tf39v4eknna166gvnpm6qukbei0u7' }}
        run: bash app/tool/prepare.sh
      - name: Build iOS (no signing, checks that it compiles)
        run: cd app && flutter build ios --release --no-codesign --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || '757704906396-fc5cgu4cq6gih42f5g3andjp6tef3p11.apps.googleusercontent.com' }}
