name: myboutki
description: myboutiki — shop and sell with your community across the Gulf.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  share_plus: ^10.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icon_fg.png
  min_sdk_android: 23

flutter_native_splash:
  color: '#FFFFFF'
  image: assets/splash_light.png
  color_dark: '#17212B'
  image_dark: assets/splash_dark.png
  android_12:
    color: '#FFFFFF'
    image: assets/splash_light.png
    color_dark: '#17212B'
    image_dark: assets/splash_dark.png
  fullscreen: false
