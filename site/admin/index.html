<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>myboutiki admin</title>
<link rel="icon" type="image/svg+xml" href="/img/mark.svg">
<style>
:root{color-scheme:light;--bg:#fff;--page:#f4f2ee;--ink:#111;--muted:#6b6b6b;--line:#e8e5df;--soft:#f7f5f1;--gold:#b8913e;--blue:#1D9BF0;--ok:#1f9d55;--red:#d93838}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--page);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top img{height:34px}.top b{font-family:Georgia,serif;font-size:24px}.top .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{height:38px;padding:0 16px;border-radius:19px;color:var(--muted);font-weight:500}.tabs button.on{background:var(--ink);color:#fff}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:28px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--blue);opacity:.75}
.muted{color:var(--muted)}.err{color:var(--red);font-size:14px;min-height:20px}.ok{color:var(--ok)}
input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{height:42px;padding:0 18px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}.btn.sec{background:var(--soft);color:var(--ink)}
.login{max-width:380px;margin:12vh auto;text-align:center}.login .card{text-align:left}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}.chart div{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;position:relative}.chart div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:3px 6px;border-radius:6px;white-space:nowrap}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 20px}.brand img{height:30px}.brand b{font-family:Georgia,serif;font-size:21px;font-weight:600}.brand span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);border-radius:6px;padding:2px 6px}
.nav button,.nav a{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border-radius:12px;color:#3a3a3a;font-weight:500;font-size:14.5px;text-decoration:none;text-align:left}
.nav button:hover,.nav a:hover{background:var(--soft)}.nav button.on{background:var(--ink);color:#fff}.nav svg{width:20px;height:20px;flex:none}
.side .sp{flex:1}.side .foot{border-top:1px solid var(--line);padding-top:10px}
.mainc{padding:26px 32px 40px;min-width:0}.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}.head h1{margin:0;font-size:24px;font-weight:700;flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--ink);color:#fff}
.kpi{position:relative;overflow:hidden}.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}.kpi .ic svg{width:19px;height:19px}
.chart{height:180px;gap:6px;justify-content:center}.chart div{max-width:46px;background:linear-gradient(180deg,#dd2a7b,#8134af);border-radius:6px 6px 2px 2px}
.bar{background:linear-gradient(90deg,#f58529,#dd2a7b 55%,#8134af);opacity:1}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 8px 0 2px}.brand b,.side .sp{display:none}.nav{display:flex;gap:4px}.nav button,.nav a{width:auto;white-space:nowrap;height:38px}.side .foot{border:0;padding:0;display:flex}.mainc{padding:16px}}

:root{--page:#f6f7fb;--line:#eceef3;--soft:#f3f4f8;--ink:#1d1d27;--muted:#7a7f8c;--acc:#7b3fe4;--acc2:#dd2a7b}
body{background:var(--page);-webkit-font-smoothing:antialiased}
.card{border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px rgba(20,20,40,.04)}
.side{background:#fff;border-right:1px solid var(--line)}
.nav button.on{background:#f1ebfd;color:var(--acc);font-weight:600}.nav button.on svg{color:var(--acc)}
.nav button,.nav a{color:#4a4f5c}
.seg{background:#fff}.seg button.on{background:#f1ebfd;color:var(--acc)}
.btn{background:var(--acc)}.btn.sec{background:var(--soft);color:var(--ink)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em}.kpi .l{font-size:13px;font-weight:500}
h2{font-size:15px;font-weight:650;color:#2a2d38}
td,th{border-bottom:1px solid #f0f1f5}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#a78bfa,#7b3fe4)}
.lc{width:100%;height:240px;display:block}.lc text{font-size:11px;fill:#9aa0ac}
.tip{position:absolute;pointer-events:none;background:#1d1d27;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.note{background:#fff;border:1px dashed var(--line)}
@media(max-width:600px){.wrap{padding:14px}.kpi .v{font-size:22px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});let j=null;try{j=await r.json()}catch(_){}if(r.status===401&&p!=='/api/admin/login'){showLogin();throw new Error('signin')}if(!r.ok)throw new Error((j&&j.error)||('Error '+r.status));return j};
const fmt=n=>Number(n||0).toLocaleString('en');
const CN={KW:'Kuwait',SA:'Saudi Arabia',AE:'UAE',BH:'Bahrain',QA:'Qatar',OM:'Oman'};
const cname=k=>{try{return new Intl.DisplayNames(['en'],{type:'region'}).of(k)}catch(_){return CN[k]||k}};
const flag=k=>/^[A-Z]{2}$/.test(k||'')?String.fromCodePoint(...[...k].map(c=>127397+c.charCodeAt(0))):'🌐';
const SRC={direct:['Direct / typed link','🔗'],google:['Google','🔎'],instagram:['Instagram','📸'],whatsapp:['WhatsApp','💬'],facebook:['Facebook','📘'],tiktok:['TikTok','🎵'],snapchat:['Snapchat','👻'],x:['X (Twitter)','✖️'],twitter:['X (Twitter)','✖️'],app:['MyBoutiki app','📱'],bing:['Bing','🔎'],other:['Other websites','🌐']};
const CLICK={wa:'WhatsApp order',add:'Add to cart',share:'Share',like:'Like',save:'Save',follow:'Follow',msgseller:'Message seller',call:'Call',boost:'Boost post',paynow:'Pay for Verified',boostpay:'Pay for boost',google:'Continue with Google',detail:'Open item',seller:'Open shop',comments:'Comments',emailsheet:'Email shop',store:'App store badge'};
let tab='overview',days=30;const IC={"verify":"<path d=\"M12 2l2.4 2.2 3.2-.4.8 3.1 2.8 1.6-1.2 3 1.2 3-2.8 1.6-.8 3.1-3.2-.4L12 22l-2.4-2.2-3.2.4-.8-3.1L2.8 15.5l1.2-3-1.2-3 2.8-1.6.8-3.1 3.2.4z\"/><path d=\"M8.5 12.2l2.3 2.3 4.7-4.8\"/>","overview": "<path d=\"M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z\"/>", "analytics": "<path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z\"/>", "shops": "<path d=\"M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6\"/>", "posts": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"9\" cy=\"9\" r=\"2\"/><path d=\"M21 15l-5-5L5 21\"/>", "payments": "<rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"3\"/><path d=\"M2 10h20\"/>", "prices": "<path d=\"M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.5\"/>", "account": "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>", "web": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"/>", "out": "<path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"/>"};const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;const TABS=[['overview','Overview'],['verify','Verification'],['analytics','What people like'],['shops','Shops'],['posts','Posts'],['payments','Payments'],['prices','Prices & settings'],['account','Account']];

function showSetup(msg){$('#root').innerHTML=`<div class="login"><img src="/img/mark.svg" alt="" style="height:54px"><h1 style="font-family:Georgia,serif;font-weight:600;margin:8px 0 6px">Create your admin login</h1><p class="muted" style="margin:0 0 18px">Only you can do this, once, with the setup code.</p>
<form class="card" id="sf"><label for="c">Setup code</label><input id="c" autocomplete="one-time-code" required><label for="u">Choose a username</label><input id="u" autocomplete="username" required minlength="3"><label for="p">Choose a password</label><input id="p" type="password" autocomplete="new-password" required minlength="6"><p class="muted" style="font-size:12px;margin:6px 0 0">At least 6 characters.</p>
<div class="err" id="se">${esc(msg||'')}</div><button class="btn" style="width:100%">Create admin login</button></form></div>`;
$('#sf').onsubmit=async e=>{e.preventDefault();$('#se').textContent='';if(false){$('#se').textContent='The passwords do not match';return}try{await api('/api/admin/setup',{method:'POST',body:JSON.stringify({code:$('#c').value,user:$('#u').value,pass:$('#p').value})});main()}catch(err){$('#se').textContent=err.message}}}
function showLogin(msg){$('#root').innerHTML=`<div class="login"><img src="/img/mark.svg" alt="" style="height:54px"><h1 style="font-family:Georgia,serif;font-weight:600;margin:8px 0 18px">myboutiki admin</h1>
<form class="card" id="lf"><label for="u">Username</label><input id="u" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<div class="err" id="le">${esc(msg||'')}</div><button class="btn" style="width:100%">Sign in</button></form></div>`;
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({user:$('#u').value,pass:$('#p').value})});main()}catch(err){$('#le').textContent=err.message}}}

async function main(){try{const st=await (await fetch('/api/admin/status')).json();if(st.setup)return showSetup()}catch(_){}try{await api('/api/admin/me')}catch(_){return}
$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="/img/mark.svg" alt=""><b>myboutiki</b><span>Admin</span></div><nav class="nav">${TABS.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${svg(k)}<span>${l}</span></button>`).join('')}</nav><div class="sp"></div><div class="foot nav"><a href="/" target="_blank">${svg('web')}<span>Open website</span></a><button id="out" style="color:var(--red)">${svg('out')}<span>Sign out</span></button></div></aside><main class="mainc"><div class="head"><h1>${(TABS.find(t=>t[0]===tab)||[])[1]||''}</h1><div id="hx"></div></div><div id="v"></div></main></div>`;
api('/api/admin/db/verifs').then(l=>{const n=l.filter(x=>x.ver.status==='pending').length,b=document.querySelector('[data-t=verify] span');if(n&&b)b.insertAdjacentHTML('afterend',`<em style="margin-left:auto;font-style:normal;background:#dd2a7b;color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:1px 8px">${n}</em>`)}).catch(()=>{});
$('#out').onclick=async()=>{await fetch('/api/admin/logout');showLogin()};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;main()});
if(tab==='verify')return verifs();if(tab==='prices')return prices();if(tab==='shops')return shops();if(tab==='posts')return postsTab();if(tab==='account')return account();if(tab==='payments')return payments();return stats()}

const table=(title,rows,label,map)=>{const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="card"><h2>${title}</h2>${rows.length?`<table>${rows.map(([k,n])=>`<tr><td style="width:55%">${esc(map?map(k):k)}</td><td style="width:30%"><div class="bar" style="width:${Math.max(4,n/max*100)}%"></div></td><td class="n">${fmt(n)}</td></tr>`).join('')}</table>`:`<p class="muted" style="margin:0">No ${label} yet.</p>`}</div>`};


function lineChart(d){const W=1000,H=240,pl=40,pr=12,pt=16,pb=28;if(d.length===1)d=[{d:'',views:0,visitors:0},...d];const n=d.length,max=Math.max(4,...d.map(x=>x.views)),nice=Math.ceil(max/4)*4;
const X=i=>pl+(W-pl-pr)*(n===1?0.5:i/(n-1)),Y=v=>pt+(H-pt-pb)*(1-v/nice);
const path=k=>{let p='';d.forEach((x,i)=>{const px=X(i),py=Y(x[k]);if(!i){p=`M${px},${py}`;return}const qx=X(i-1),qy=Y(d[i-1][k]),cx=(qx+px)/2;p+=` C${cx},${qy} ${cx},${py} ${px},${py}`});return p};
const grid=[0,1,2,3,4].map(g=>{const v=nice*g/4,y=Y(v);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eef0f4"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}).join('');
const step=Math.max(1,Math.ceil(n/8)),lab=d.map((x,i)=>i%step||!x.d?'':`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${new Date(x.d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`).join('');
const pv=path('views'),vv=path('visitors');
return `<svg class="lc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" onmousemove="lcMove(event,this)" onmouseleave="document.getElementById('tip').style.opacity=0"><defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b3fe4" stop-opacity=".28"/><stop offset="1" stop-color="#7b3fe4" stop-opacity="0"/></linearGradient><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2a3c7" stop-opacity=".35"/><stop offset="1" stop-color="#f2a3c7" stop-opacity="0"/></linearGradient></defs>${grid}
<path d="${pv} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#gp)"/><path d="${pv}" fill="none" stroke="#f2a3c7" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
<path d="${vv} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#gv)"/><path d="${vv}" fill="none" stroke="#7b3fe4" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>${lab}<line id="lcl" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#c9b8f5" stroke-dasharray="4 4" opacity="0"/></svg>`.replace('<svg','<svg data-n="'+n+'" data-pl="'+pl+'" data-pr="'+pr+'" data-w="'+W+'" data-pts=\''+JSON.stringify(d.map(x=>[x.d,x.visitors,x.views]))+'\'')}
function lcMove(ev,el){const r=el.getBoundingClientRect(),W=+el.dataset.w,pl=+el.dataset.pl,pr=+el.dataset.pr,n=+el.dataset.n,pts=JSON.parse(el.dataset.pts);const x=(ev.clientX-r.left)/r.width*W;let i=Math.round((x-pl)/((W-pl-pr)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));const p=pts[i];if(!p[0])return;const ln=el.querySelector('#lcl'),xx=pl+(W-pl-pr)*(n===1?.5:i/(n-1));ln.setAttribute('x1',xx);ln.setAttribute('x2',xx);ln.setAttribute('opacity',1);const t=document.getElementById('tip');t.innerHTML=`<b>${new Date(p[0]).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b><br>${fmt(p[1])} visitors · ${fmt(p[2])} views`;const cr=el.parentElement.getBoundingClientRect();t.style.left=(r.left-cr.left+xx/W*r.width)+'px';t.style.top=(ev.clientY-cr.top)+'px';t.style.opacity=1}
async function stats(){const v=$('#v');v.innerHTML='<p class="muted">Loading…</p>';const s=await api('/api/admin/stats?days='+days);
const rev=(s.payments||[]).reduce((a,p)=>a+(+p.amount||0),0),views=s.daily.reduce((a,d)=>a+d.views,0),maxV=Math.max(1,...s.daily.map(d=>d.views));
const pick='';const hx=$('#hx');if(hx)hx.innerHTML=`<div class="seg">${[1,7,30,90].map(d=>`<button class="${d===days?'on':''}" data-d="${d}">${d===1?'Today':d+' days'}</button>`).join('')}</div>`;if(hx)hx.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;stats()});
if(tab==='overview'){v.innerHTML=pick+`<div class="kpis"><div class="card kpi"><div class="ic" style="background:#eaf7ef;color:#1f9d55"><span style="width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)"></span></div><div class="l">Online now</div><div class="v">${fmt(s.online||0)}</div></div><div class="card kpi"><div class="ic" style="background:#e8f3fe;color:#1D9BF0">${svg('account')}</div><div class="l">Visitors</div><div class="v">${fmt(s.visitors)}</div></div><div class="card kpi"><div class="ic" style="background:#fdeef5;color:#dd2a7b">${svg('web')}</div><div class="l">Page views</div><div class="v">${fmt(views)}</div></div><div class="card kpi"><div class="ic" style="background:#f3eefb;color:#8134af">${svg('posts')}</div><div class="l">On mobile</div><div class="v">${s.events?Math.round(s.mobile/s.events*100):0}%</div></div><div class="card kpi"><div class="ic" style="background:#eaf7ef;color:#1f9d55">${svg('payments')}</div><div class="l">Revenue</div><div class="v">KWD ${rev.toFixed(3)}</div></div><div class="card kpi"><div class="ic" style="background:#fff4e6;color:#f58529">${svg('prices')}</div><div class="l">Payments</div><div class="v">${fmt((s.payments||[]).length)}</div></div></div>
<div class="card" style="margin-bottom:12px;position:relative"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Visitors per day</h2><span class="muted" style="font-size:13px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7b3fe4;margin-right:6px"></span>Visitors <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#f2a3c7;margin:0 6px 0 14px"></span>Page views</span></div>${s.daily.length?lineChart(s.daily):'<p class="muted">No visits yet. Data appears as people use the website.</p>'}<div class="tip" id="tip"></div></div>
<div class="grid2">${table('Where visitors are from',s.visitorCountries||s.countries,'countries',k=>flag(k)+'  '+cname(k))}${table('How they found you',s.sources||[],'visits',k=>(SRC[k]||[k,'🌐'])[1]+'  '+(SRC[k]||[k])[0])}</div><div class="grid2" style="margin-top:12px">${table('Language',s.languages,'data',k=>k==='ar'?'🇸🇦  Arabic':k==='en'?'🇬🇧  English':k)}</div>
<div class="grid2" style="margin-top:12px"><div class="card"><h2>Sign-up funnel</h2>${(()=>{const f=s.funnel||{},rows=[['Opened sign-up',f.opened||0],['Tapped Google',f.google||0],['Tapped email',f.email||0],['Finished sign-up',s._joined||0]],mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([l,n])=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between;font-size:14px"><span>${l}</span><b>${fmt(n)}</b></div><div style="height:10px;border-radius:5px;background:#f0f1f5;margin-top:5px"><div class="bar" style="height:10px;width:${Math.max(2,n/mx*100)}%"></div></div></div>`).join('')})()}</div><div class="card"><h2>New sign-ups</h2><div id="nsu"><p class="muted">Loading…</p></div></div></div>
<p class="note" style="margin-top:12px">Counts are anonymous: no names, emails or phone numbers are recorded. A visitor is counted once per day per device.</p>`}
else v.innerHTML=pick+`<div class="grid2">${table('Most viewed items',s.items,'item views')}${table('Most popular categories',s.categories,'category views')}${table('Most visited shops',s.shops,'shop visits')}${table('Top searches',s.searches,'searches')}${table('What people click',s.clicks,'clicks',k=>CLICK[k]||k)}${table('Screens',s.screens,'views')}</div>`;
v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;stats()});
if(tab==='overview')api('/api/admin/db/stores').then(l=>{const since=Date.now()-days*864e5,nu=l.filter(x=>x.created>=since);const el=$('#nsu');if(!el)return;const fl=[...document.querySelectorAll('.card h2')].find(h=>h.textContent==='Sign-up funnel');if(fl){const bs=fl.parentElement.querySelectorAll('b');if(bs[3])bs[3].textContent=fmt(nu.length)}el.innerHTML=nu.length?`<table>${nu.slice(0,12).map(x=>`<tr><td><b>${esc(x.name||x.handle)}</b><div class="muted" style="font-size:12px">@${esc(x.handle)} · ${x.role==='shopper'?'Shopper':'Seller'}</div></td><td>${flag(x.k)} <a href="https://wa.me/${esc((x.phone||'').replace(/\D/g,''))}" target="_blank" dir="ltr">${esc(x.phone)}</a></td><td class="muted" style="text-align:right;font-size:12px">${new Date(x.created).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</td></tr>`).join('')}</table>`:'<p class="muted" style="margin:0">No new sign-ups in this period.</p>'}).catch(()=>{})}


async function verifs(){const v=$('#v');v.innerHTML='<p class="muted">Loading…</p>';const list=await api('/api/admin/db/verifs');
const ST={pending:['Waiting for you','#b45309','#fff4e6'],approved:['Approved · waiting for payment','#1f9d55','#eaf7ef'],rejected:['Rejected','#d93838','#fdecec'],active:['Verified ✓','#1D9BF0','#e8f3fe']};
const IDN={KW:'Civil ID',SA:'National ID / Iqama',AE:'Emirates ID',BH:'CPR',QA:'QID',OM:'Civil number'};
const pend=list.filter(x=>x.ver.status==='pending').length;
v.innerHTML=`<div class="kpis"><div class="card kpi"><div class="ic" style="background:#fff4e6;color:#f58529">${svg('verify')}</div><div class="l">Waiting for approval</div><div class="v">${fmt(pend)}</div></div><div class="card kpi"><div class="ic" style="background:#e8f3fe;color:#1D9BF0">${svg('verify')}</div><div class="l">Verified shops</div><div class="v">${fmt(list.filter(x=>x.ver.status==='active').length)}</div></div></div>
${list.length?list.map(x=>{const st=ST[x.ver.status]||[x.ver.status,'#666','#eee'];return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div style="font-weight:700;font-size:16px"><a href="/@${esc(x.handle)}" target="_blank" style="color:inherit">@${esc(x.handle)}</a> <span class="muted" style="font-weight:500">· ${esc(x.shop||'')}</span></div><div class="muted" style="font-size:13px;margin-top:2px">${esc(x.email)} · <a href="https://wa.me/${esc((x.phone||'').replace(/\D/g,''))}" target="_blank">${esc(x.phone)}</a> · ${flag(x.k)} ${esc(cname(x.k||''))}</div></div><span style="background:${st[2]};color:${st[1]};font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:999px">${st[0]}</span></div>
<div class="grid2" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><div class="muted" style="font-size:12px">Name on card</div><div style="font-weight:600">${esc(x.ver.name||'—')}</div></div><div><div class="muted" style="font-size:12px">${IDN[x.ver.k]||'ID'} number</div><div style="font-weight:600;font-variant-numeric:tabular-nums">${esc(x.ver.num||'—')}</div></div><div><div class="muted" style="font-size:12px">Plan</div><div style="font-weight:600">${x.ver.plan==='yearly'?'Yearly':'Monthly'}</div></div><div><div class="muted" style="font-size:12px">Sent</div><div style="font-weight:600">${new Date(x.ver.submitted).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div>
<div class="row" style="margin-top:14px;gap:12px;align-items:stretch">${['front','back'].map(k=>x.ver[k]?`<a href="/api/admin/db/id/${esc(x.ver[k])}" target="_blank" style="flex:1;min-width:220px;max-width:380px;display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)"><img src="/api/admin/db/id/${esc(x.ver[k])}" alt="${k} of card" style="width:100%;aspect-ratio:1.586;object-fit:contain;display:block"><div class="muted" style="font-size:12px;padding:6px 10px">${k==='front'?'Front':'Back'} · tap to open full size</div></a>`:'').join('')}</div>
${x.ver.status==='pending'||x.ver.status==='rejected'||x.ver.status==='approved'?`<div class="row" style="margin-top:14px">${x.ver.status!=='approved'?`<button class="btn" style="background:#1f9d55" data-va="${esc(x.handle)}" data-do="approve">Approve</button>`:''}${x.ver.status!=='rejected'?`<button class="btn sec" style="color:var(--red)" data-va="${esc(x.handle)}" data-do="reject">Reject</button>`:''}${x.ver.note?`<span class="muted" style="font-size:13px">Note: ${esc(x.ver.note)}</span>`:''}</div>`:''}</div>`}).join(''):'<div class="card"><p class="muted" style="margin:0">No verification requests yet. When a shop sends its ID, it shows here for you to approve.</p></div>'}`;
v.querySelectorAll('[data-va]').forEach(b=>b.onclick=async()=>{const h=b.dataset.va,ok=b.dataset.do==='approve';let note='';if(!ok){note=prompt('Reason for rejecting (the seller will see it):','Photo is not clear')||''}else if(!confirm('Approve @'+h+'? They can then pay to get the blue badge.'))return;b.disabled=true;await api('/api/admin/db/verifs/'+encodeURIComponent(h)+'/'+(ok?'approve':'reject'),{method:'POST',body:JSON.stringify({note})});verifs();main()})}
async function payments(){const v=$('#v');v.innerHTML='<p class="muted">Loading…</p>';const list=await api('/api/admin/payments');const tot=list.reduce((a,p)=>a+(+p.amount||0),0);
const name=p=>/^verified-/.test(p.product)?'Verified · '+(p.product.split('-')[1]==='yearly'?'Yearly':'Monthly'):p.product==='boost'?'Boost post':p.product;
v.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">Total received</div><div class="v">KWD ${tot.toFixed(3)}</div></div><div class="card kpi"><div class="l">Payments</div><div class="v">${fmt(list.length)}</div></div></div>
<div class="card"><h2>Payments</h2>${list.length?`<table><tr><th>Date</th><th>Shop</th><th>For</th><th>Method</th><th>Invoice</th><th style="text-align:right">Amount</th></tr>${list.map(p=>`<tr><td>${new Date(p.t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>@${esc(p.handle)}</td><td>${esc(name(p))}</td><td>${esc(p.method||'')}</td><td class="muted">${esc(p.invoiceId)}</td><td class="n">${esc(p.currency||'KWD')} ${(+p.amount||0).toFixed(3)}</td></tr>`).join('')}</table>`:'<p class="muted" style="margin:0">No payments yet. Paid Verified plans and boosts appear here automatically.</p>'}</div>`}

async function prices(){const v=$('#v');const c=await (await fetch('/api/config')).json();const f=(id,l,val,step='0.001')=>`<div><label for="${id}">${l}</label><input id="${id}" type="number" step="${step}" min="0" value="${val}"></div>`;
v.innerHTML=`<form class="card" id="pf" style="max-width:760px"><h2>Verified badge</h2><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${f('mu','Monthly price (USD, shown)',c.verified.monthlyUsd,'0.01')}${f('mk','Monthly charge (KWD)',c.verified.monthlyKwd)}${f('yu','Yearly price (USD, shown)',c.verified.yearlyUsd,'0.01')}${f('yk','Yearly charge (KWD)',c.verified.yearlyKwd)}</div>
<h2 style="margin-top:22px">Boost post</h2><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${f('bmin','Minimum daily budget (USD)',c.boost.minDaily,'1')}${f('bmax','Maximum daily budget (USD)',c.boost.maxDaily,'1')}${f('brate','1 USD = ? KWD',c.boost.usdToKwd)}<div><label for="bdays">Durations (days, comma separated)</label><input id="bdays" value="${c.boost.days.join(', ')}"></div></div>
${(()=>{const P=c.placements||{google:{usd:5,days:7},explore:{usd:12,days:7},home:{usd:12,days:7}};return `<h2 style="margin-top:22px">Fixed boost spots</h2><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${f('phu','Top of Home price (USD)',P.home.usd)}${f('phd','Top of Home days',P.home.days,'1')}${f('peu','Top of Explore price (USD)',P.explore.usd)}${f('ped','Top of Explore days',P.explore.days,'1')}${f('pgu','Google Search price (USD)',P.google.usd)}${f('pgd','Google Search days',P.google.days,'1')}</div>`})()}<h2 style="margin-top:22px">Sample shops</h2><label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px"><input id="smp" type="checkbox" style="width:20px;height:20px" ${c.showSamples!==false?'checked':''}> Show the 4 sample shops (for testing). Untick when real shops are live.</label>
<p class="note" style="margin:16px 0">Changes apply straight away on the website and the app: new prices show the next time a page opens, and new payments are charged at the new price.</p>
<div class="row"><button class="btn">Save prices</button><span id="pm" class="muted"></span></div></form>`;
$('#pf').onsubmit=async e=>{e.preventDefault();const n=id=>+$('#'+id).value;$('#pm').textContent='Saving…';$('#pm').className='muted';
try{await api('/api/admin/config',{method:'POST',body:JSON.stringify({verified:{monthlyUsd:n('mu'),monthlyKwd:n('mk'),yearlyUsd:n('yu'),yearlyKwd:n('yk')},boost:{minDaily:n('bmin'),maxDaily:n('bmax'),usdToKwd:n('brate'),days:$('#bdays').value.split(/[^0-9]+/).filter(Boolean).map(Number)},placements:{home:{usd:n('phu'),days:n('phd')},explore:{usd:n('peu'),days:n('ped')},google:{usd:n('pgu'),days:n('pgd')}},showSamples:$('#smp').checked})});$('#pm').textContent='Saved. Live on the website and app now.';$('#pm').className='ok'}catch(err){if(err.message!=='signin'){$('#pm').textContent=err.message;$('#pm').className='err'}}}}

async function shops(){const v=$('#v');v.innerHTML='<p class="muted">Loading…</p>';const list=await api('/api/admin/db/stores');
v.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">Shops</div><div class="v">${fmt(list.length)}</div></div><div class="card kpi"><div class="l">Verified</div><div class="v">${fmt(list.filter(s=>s.ver&&s.ver.status==='active').length)}</div></div><div class="card kpi"><div class="l">Posts</div><div class="v">${fmt(list.reduce((a,s)=>a+s.posts,0))}</div></div></div>
<div class="card"><h2>Shops</h2>${list.length?`<table><tr><th>Shop</th><th>Owner</th><th>Country</th><th>Phone</th><th>Posts</th><th>Joined</th><th></th></tr>${list.map(s=>`<tr style="${s.banned?'opacity:.5':''}"><td><a href="/@${esc(s.handle)}" target="_blank">@${esc(s.handle)}</a>${s.ver&&s.ver.status==='active'?' <span style="color:var(--blue)">✓ verified</span>':''}<div class="muted" style="font-size:12px">${esc(s.name)}</div></td><td class="muted">${esc(s.email)}</td><td>${esc(CN[s.k]||s.k)}</td><td>${esc(s.phone)}</td><td class="n">${s.posts}</td><td class="muted">${new Date(s.created).toLocaleDateString('en-GB')}</td><td><button class="btn sec" style="height:32px;padding:0 10px;${s.banned?'':'color:var(--red)'}" data-ban="${esc(s.handle)}" data-on="${s.banned?0:1}">${s.banned?'Unblock':'Block'}</button></td></tr>`).join('')}</table>`:'<p class="muted" style="margin:0">No shops yet. Shops appear here as soon as people sign up.</p>'}</div>`;
v.querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{const h=b.dataset.ban,on=b.dataset.on==='1';if(on&&!confirm('Block @'+h+'? Their shop and posts will disappear from myboutiki until you unblock them.'))return;await api('/api/admin/db/stores/'+encodeURIComponent(h)+'/'+(on?'ban':'unban'),{method:'POST'});shops()})}
async function postsTab(){const v=$('#v');v.innerHTML='<p class="muted">Loading…</p>';const list=await api('/api/admin/db/posts');
v.innerHTML=`<div class="card"><h2>Posts (${fmt(list.length)})</h2>${list.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px">${list.map(p=>`<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden"><a href="/p/${p.id}" target="_blank"><img src="${esc(p.imgs[0]||'')}" alt="" loading="lazy" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--soft)"></a><div style="padding:8px 10px;font-size:13px"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.h)}</div><div class="muted">@${esc(p.s)} · KWD ${(+p.p).toFixed(3)}${p.sold?' · SOLD':''}</div><button class="btn sec" style="height:32px;width:100%;margin-top:6px;color:var(--red)" data-del="${esc(p.id)}">Delete post</button></div></div>`).join('')}</div>`:'<p class="muted" style="margin:0">No posts yet.</p>'}</div>`;
v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this post? It disappears from the website and app for everyone, including the seller.'))return;b.disabled=true;await api('/api/admin/db/posts/'+encodeURIComponent(b.dataset.del),{method:'DELETE'});b.closest('div[style*=border]').remove()})}
function account(){const v=$('#v');v.innerHTML=`<form class="card" id="af" style="max-width:420px"><h2>Change password</h2><label for="o">Current password</label><input id="o" type="password" autocomplete="current-password" required><label for="n">New password</label><input id="n" type="password" autocomplete="new-password" required minlength="6"><div class="err" id="ae"></div><button class="btn">Save new password</button></form>`;
$('#af').onsubmit=async e=>{e.preventDefault();const m=$('#ae');m.className='err';if(false){m.textContent='The passwords do not match';return}try{await api('/api/admin/password',{method:'POST',body:JSON.stringify({old:$('#o').value,pass:$('#n').value})});m.className='ok';m.textContent='Password changed.';e.target.reset()}catch(err){if(err.message!=='signin')m.textContent=err.message}}}
main();
</script>
<style>.pwwrap{position:relative;display:block}.pwwrap input{padding-right:44px!important;width:100%;box-sizing:border-box}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;cursor:pointer;color:#777;display:flex;align-items:center;justify-content:center;padding:0}</style>
<script>(function(){const eye='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',off='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>';
const addEyes=()=>document.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye=1;const w=document.createElement('span');w.className='pwwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='pweye';b.setAttribute('aria-label','Show password');b.innerHTML=eye;b.onclick=()=>{const sh=i.type==='password';i.type=sh?'text':'password';b.innerHTML=sh?off:eye;b.setAttribute('aria-label',sh?'Hide password':'Show password');i.focus()};w.appendChild(b)});addEyes();new MutationObserver(addEyes).observe(document.getElementById('root'),{childList:true,subtree:true})})();</script>
