const pad=72;g.fillStyle='#111';g.font=`600 ${fmt==='story'?60:52}px Inter, 'Plex Arabic', system-ui, sans-serif`;g.textBaseline='top';
let t=x.h,maxW=W-pad*2-(fmt==='story'?200:180);while(g.measureText(t).width>maxW&&t.length>4)t=t.slice(0,-2);if(t!==x.h)t=t.replace(/\s*\S*$/,'')+'…';g.fillText(t,pad,y0+(fmt==='story'?70:52));
g.fillStyle='#b8913e';g.font=`700 ${fmt==='story'?64:54}px Inter, system-ui, sans-serif`;g.fillText(pr(x).replace(/\u00a0/g,' '),pad,y0+(fmt==='story'?160:126));
