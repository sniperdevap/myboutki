server {
    listen 80;
    listen [::]:80;
    server_name myboutki.com www.myboutki.com;
    root /var/www/myboutki.com;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/pay/ { proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; add_header Cache-Control "no-store"; }
    location ^~ /pay/ { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
    location ^~ /p/  { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
    location ~ ^/@   { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
    location ~* \.(?:jpg|jpeg|png|webp|svg|woff2|ico|webmanifest)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; access_log off; try_files $uri =404; }
    location ~* \.(?:css|js)$ { expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    error_page 404 /404.html;
}
