    # myboutki API + admin (added into the HTTPS server block)
    location ^~ /api/ { proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; add_header Cache-Control "no-store"; }
    location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-store"; }
    location ^~ /pay/ { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
    # Google sign-in through myboutki.com (Firebase auth handler)
    location ^~ /__/ { proxy_pass https://myboutki.firebaseapp.com; proxy_ssl_server_name on; proxy_set_header Host myboutki.firebaseapp.com; proxy_set_header X-Forwarded-For $remote_addr; }
