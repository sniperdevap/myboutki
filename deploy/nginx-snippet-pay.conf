    # myboutki payment routes (added into the HTTPS server block)
    location ^~ /api/pay/ { proxy_pass http://127.0.0.1:18090; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s; add_header Cache-Control "no-store"; }
    location ^~ /pay/ { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
