# API (payments, prices, analytics, admin). Secrets are NOT here: it is set as MF_API_KEY in the Hostinger project environment.
services:
  pay:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "pay.js"]
    volumes:
      - /opt/myboutki/server:/app:ro
      - /opt/myboutki/data:/data
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      - MF_API_KEY=${MF_API_KEY}
      - MF_API_URL=https://api.myfatoorah.com
      - SITE_URL=https://myboutki.com
      - DATA_DIR=/data
      - SETUP_CODE_SHA256=${SETUP_CODE_SHA256}
